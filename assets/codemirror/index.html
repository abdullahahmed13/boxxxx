    function configureCodeMirror(isDarkMode, extension) {
        const mode = extensionModeMap[extension] || "clike";
        var theme = isDarkMode ? "darcula" : "github"; // Set the theme based on isDarkMode
        console.log('Configuring CodeMirror with theme: ' + theme + ' and mode: ' + mode);

        var lineNumbers = true;
        var lineWrapping = true;
        var code;

        // Remove existing CodeMirror instance
        $(".CodeMirror").remove();

        // Set up CodeMirror instance
        CodeMirror.modeURL = "codemirror/mode/%N/%N.js";
        code = CodeMirror.fromTextArea(document.getElementById("code"), {
            lineNumbers: lineNumbers,
            lineWrapping: lineWrapping,
            readOnly: "nocursor",
            theme: theme,
            onUpdate: function() {
                var viewportmeta = document.querySelector('meta[name="viewport"]');
                viewportmeta.content = 'width=320, minimum-scale=1, maximum-scale=1';
            }
        });

        if (mode.length > 0) {
            code.setOption("mode", mode);
            CodeMirror.autoLoadMode(code, mode);
        }
    }
</script>
